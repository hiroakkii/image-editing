<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#15171c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="モザイク編集">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>モザイク編集</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="openBtn" class="btn primary" type="button">開く</button>
    <div class="fileinfo">
      <span id="fileName" class="filename">画像未選択</span>
      <span id="fileMeta" class="filemeta"></span>
    </div>
    <button id="undoBtn" class="icon" type="button" aria-label="元に戻す" title="元に戻す" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="redoBtn" class="icon" type="button" aria-label="やり直す" title="やり直す" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <button id="saveBtn" class="btn accent" type="button" disabled>保存</button>
    <input type="file" id="fileInput" multiple accept="image/*,.png,.jpg,.jpeg,.heic,.heif,.webp" hidden>
  </header>

  <main id="stage" class="stage">
    <canvas id="view"></canvas>
    <div id="empty" class="empty">
      <p class="empty-title">「開く」から画像を選択</p>
      <p class="empty-sub">写真ライブラリ・ファイルのどちらからでも開けます。<br>画像はこの端末の中だけで処理され、外部に送信されません。</p>
    </div>
    <div class="zoomctl" id="zoomCtl" hidden>
      <button id="fitBtn" type="button">全体</button>
      <span id="zoomLabel">100%</span>
      <button id="oneBtn" type="button">等倍</button>
    </div>
  </main>

  <section class="strip" id="strip" aria-label="読み込んだ画像" hidden>
    <div class="strip-head">
      <span id="stripCount" class="strip-count">1 / 1</span>
      <div class="meter-wrap" title="読み込める量（枚数・合計サイズ）">
        <div class="meter" id="meter"><div id="meterBar"></div></div>
        <span id="meterText" class="meter-text"></span>
      </div>
      <button id="copyBtn" class="btn small" type="button" disabled>他にも適用</button>
      <button id="batchBtn" class="btn small accent" type="button" disabled>まとめて保存</button>
    </div>
    <div class="strip-row">
      <button id="prevBtn" class="icon small" type="button" aria-label="前の画像">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div id="thumbs" class="thumbs"></div>
      <button id="nextBtn" class="icon small" type="button" aria-label="次の画像">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </section>

  <section class="panel" aria-label="編集ツール">
    <div class="seg mode" id="modeSeg" role="radiogroup" aria-label="編集メニュー">
      <button type="button" data-mode="hide">隠す</button>
      <button type="button" data-mode="write">書き込む</button>
    </div>
    <div id="hidePanel" class="subpanel">
    <div class="seg" id="toolSeg" role="radiogroup" aria-label="範囲の指定方法">
      <button type="button" data-tool="pan">移動</button>
      <button type="button" data-tool="lasso">なぞる</button>
      <button type="button" data-tool="rect">四角</button>
      <button type="button" data-tool="ellipse">楕円</button>
    </div>
    <div class="seg" id="effectSeg" role="radiogroup" aria-label="編集の種類">
      <button type="button" data-effect="mosaic">モザイク</button>
      <button type="button" data-effect="blur">ぼかし</button>
      <button type="button" data-effect="fill">塗りつぶし</button>
    </div>
    <div class="row" id="strengthRow">
      <label for="strengthNum" id="strengthLabel">ブロックの大きさ</label>
      <input type="range" id="strengthRange" aria-labelledby="strengthLabel">
      <input type="number" id="strengthNum" inputmode="numeric" step="1">
      <span class="unit">px</span>
    </div>
    <div class="row" id="colorRow" hidden>
      <label for="colorInput">色</label>
      <div class="swatches">
        <button type="button" class="swatch" data-color="#000000" style="background:#000" aria-label="黒"></button>
        <button type="button" class="swatch" data-color="#ffffff" style="background:#fff" aria-label="白"></button>
        <button type="button" class="swatch" data-color="#808080" style="background:#808080" aria-label="グレー"></button>
        <input type="color" id="colorInput" value="#000000" aria-label="任意の色">
      </div>
    </div>
    <div class="row actions">
      <p class="hint" id="hint"></p>
      <button id="clearSelBtn" class="btn" type="button" disabled>解除</button>
      <button id="applyBtn" class="btn accent" type="button" disabled>適用</button>
    </div>
    </div>

    <div id="writePanel" class="subpanel" hidden>
      <div class="addrow" id="addRow">
        <button type="button" data-add="text"><span class="ai">A</span>文字</button>
        <button type="button" data-add="bubble"><span class="ai">💬</span>吹き出し</button>
        <button type="button" data-add="arrow"><span class="ai">➚</span>矢印</button>
        <button type="button" data-add="frame"><span class="ai">◯</span>枠</button>
        <button type="button" data-add="stamp"><span class="ai">★</span>スタンプ</button>
      </div>
      <p class="hint" id="writeHint"></p>
      <div id="propPanel" class="props" hidden>
        <div class="seg small" id="pTabs" data-for="bubble" aria-label="設定の切り替え">
          <button type="button" data-tab="text">文字</button>
          <button type="button" data-tab="shape">吹き出しの形・色</button>
        </div>
        <textarea id="pText" rows="2" placeholder="文字を入力" data-for="text bubble" data-tab="text"></textarea>
        <div class="row wrap" data-for="text bubble" data-tab="text">
          <select id="pFont" aria-label="フォント">
            <option value="gothic">ゴシック</option>
            <option value="mincho">明朝</option>
            <option value="maru">丸ゴシック</option>
          </select>
          <label class="mini">サイズ<input type="number" id="pSize" inputmode="numeric" min="4" max="2000"></label>
          <button type="button" class="tog" id="pBold">太字</button>
          <button type="button" class="tog" id="pVertical">縦書き</button>
          <button type="button" class="tog" id="pAlign">中央揃え</button>
        </div>
        <div class="row" data-for="text bubble" data-tab="text"><label>文字色</label><div class="pal" data-prop="color"></div></div>
        <div class="row" data-for="text bubble" data-tab="text"><label>縁取り</label><div class="pal" data-prop="outline" data-none="1"></div></div>
        <div class="seg small" id="pShape" data-for="bubble" data-tab="shape" aria-label="吹き出しの形">
          <button type="button" data-v="round">角丸</button>
          <button type="button" data-v="ellipse">楕円</button>
          <button type="button" data-v="rect">四角</button>
          <button type="button" data-v="shout">叫び</button>
          <button type="button" data-v="thought">思考</button>
        </div>
        <div class="row" data-for="bubble" data-tab="shape"><label>塗り</label><div class="pal" data-prop="fill"></div></div>
        <div class="row" data-for="bubble" data-tab="shape"><label>線</label><div class="pal" data-prop="line"></div></div>
        <div class="row" data-for="bubble" data-tab="shape"><label>線の太さ</label><input type="number" id="pLineWidth" inputmode="numeric" min="0" max="200"><span class="unit">px</span></div>
        <div class="seg small" id="pFrameShape" data-for="frame" aria-label="枠の形">
          <button type="button" data-v="rect">四角</button>
          <button type="button" data-v="round">角丸</button>
          <button type="button" data-v="ellipse">楕円</button>
        </div>
        <div class="row" data-for="arrow frame"><label>色</label><div class="pal" data-prop="color"></div></div>
        <div class="row" data-for="arrow frame">
          <label>太さ</label><input type="number" id="pWidth" inputmode="numeric" min="1" max="500"><span class="unit">px</span>
          <button type="button" class="tog" id="pDouble" data-for="arrow">両矢印</button>
        </div>
        <div class="stamps" id="pStamps" data-for="stamp"></div>
        <div class="row objactions">
          <button type="button" class="btn" id="pDup">複製</button>
          <button type="button" class="btn" id="pFront">前面へ</button>
          <button type="button" class="btn danger" id="pDelete">削除</button>
          <button type="button" class="btn" id="pDone">選択解除</button>
        </div>
      </div>
    </div>
  </section>

  <dialog id="saveDlg">
    <form method="dialog" class="dlg">
      <h2>保存</h2>
      <label for="nameInput" class="dlg-label">ファイル名</label>
      <div class="namefield">
        <input id="nameInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
        <span id="extLabel">.png</span>
      </div>
      <button type="button" id="resetNameBtn" class="link">元の名前に戻す</button>
      <ul id="formatNote" class="note"></ul>
      <button type="button" id="shareBtn" class="btn accent wide">写真・ファイルに保存（共有メニュー）</button>
      <button type="button" id="downloadBtn" class="btn wide">ダウンロード</button>
      <button value="cancel" class="btn ghost wide">閉じる</button>
    </form>
  </dialog>

  <dialog id="copyDlg">
    <form method="dialog" class="dlg">
      <h2>他の画像にも適用</h2>
      <p id="copySummary" class="dlg-text"></p>
      <label class="check"><input type="checkbox" id="copyOps"> 隠す編集（モザイクなど）<span id="copyOpsN"></span></label>
      <label class="check"><input type="checkbox" id="copyAnnos"> 書き込み（文字・吹き出しなど）<span id="copyAnnosN"></span></label>
      <button type="button" id="copyAllBtn" class="link">すべて選択／解除</button>
      <div id="copyList" class="copy-list"></div>
      <p class="dlg-text small">同じサイズの画像は最初から選ばれています。適用した後、位置がずれた画像は開いて「元に戻す」で取り消せます。</p>
      <button type="button" id="copyApplyBtn" class="btn accent wide">適用</button>
      <button value="cancel" class="btn ghost wide">閉じる</button>
    </form>
  </dialog>

  <dialog id="batchDlg">
    <form method="dialog" class="dlg">
      <h2>まとめて保存</h2>
      <p id="batchSummary" class="dlg-text"></p>
      <label class="check" id="includeSavedRow"><input type="checkbox" id="includeSaved"> 保存済みの画像も含める</label>
      <div class="progress"><div id="batchProgress"></div></div>
      <p id="batchStatus" class="dlg-text"></p>
      <ul class="note">
        <li>元のファイル名・形式で保存します（PNGは劣化なし、JPEG・HEICは品質95%）</li>
        <li>メタデータは削除されます</li>
      </ul>
      <button type="button" id="batchShareBtn" class="btn accent wide" disabled>準備中…</button>
      <button type="button" id="batchDownloadBtn" class="btn wide" disabled>ダウンロード</button>
      <button value="cancel" class="btn ghost wide">閉じる</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
